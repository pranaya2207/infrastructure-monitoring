<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Stylized Landmark / Capitol / Pillar Icon -->
  <g fill="url(#goldGrad)" transform="translate(106, 116)">
    <!-- Roof / Pediment -->
    <polygon points="150,20 30,90 270,90"/>
    <!-- Architrave -->
    <rect x="35" y="96" width="230" height="18" rx="4"/>
    <!-- 4 Pillars -->
    <rect x="52" y="122" width="28" height="115" rx="5"/>
    <rect x="108" y="122" width="28" height="115" rx="5"/>
    <rect x="164" y="122" width="28" height="115" rx="5"/>
    <rect x="220" y="122" width="28" height="115" rx="5"/>
    <!-- Base -->
    <rect x="35" y="244" width="230" height="18" rx="4"/>
    <rect x="15" y="268" width="270" height="24" rx="6"/>
  </g>
</svg>
